<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Language Translation Tool</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>🌍 AI Language Translation Tool</h1>

    <p class="subtitle">
        Translate text into multiple languages instantly using AI-powered translation.
    </p>

    <form method="POST">

        <textarea
            name="text"
            placeholder="Enter text here..."
            rows="6"
            required>{{ input_text }}</textarea>

        <div class="dropdowns">

            <select name="source_lang">

                <option value="auto" {% if source_lang=="auto" %}selected{% endif %}>Auto Detect</option>
                <option value="en" {% if source_lang=="en" %}selected{% endif %}>English</option>
                <option value="hi" {% if source_lang=="hi" %}selected{% endif %}>Hindi</option>
                <option value="fr" {% if source_lang=="fr" %}selected{% endif %}>French</option>
                <option value="es" {% if source_lang=="es" %}selected{% endif %}>Spanish</option>
                <option value="de" {% if source_lang=="de" %}selected{% endif %}>German</option>

            </select>

            <select name="target_lang">

                <option value="hi" {% if target_lang=="hi" %}selected{% endif %}>Hindi</option>
                <option value="en" {% if target_lang=="en" %}selected{% endif %}>English</option>
                <option value="fr" {% if target_lang=="fr" %}selected{% endif %}>French</option>
                <option value="es" {% if target_lang=="es" %}selected{% endif %}>Spanish</option>
                <option value="de" {% if target_lang=="de" %}selected{% endif %}>German</option>

            </select>

        </div>

        <div class="buttons">

            <button type="submit">
                Translate
            </button>

            <button
                type="button"
                class="clear-btn"
                onclick="clearForm()">
                Clear
            </button>

        </div>

    </form>

    {% if translated_text %}

    <div class="output">

        <h2>📝 Original Text</h2>

        <p class="original-text">
            {{ input_text }}
        </p>

        <br>

        <h2>🌍 Translated Text</h2>

        <p class="translated-text">
            {{ translated_text }}
        </p>

    </div>

    {% endif %}

    <!-- Translation History -->

    <div class="history-section">

        <div class="history-header">

            <h2>📜 Translation History</h2>

            <button
                class="history-clear"
                onclick="clearHistory()">

                Clear History

            </button>

        </div>

        <div id="historyList">

        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
